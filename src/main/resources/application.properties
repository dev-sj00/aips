spring.application.name=demo

spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.url=jdbc:postgresql://localhost:5432/aips
spring.datasource.username=myuser
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.elasticsearch.uris=https://localhost:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=123456

spring.ssl.bundle.jks.es.truststore.location=classpath:es-truststore.p12
spring.ssl.bundle.jks.es.truststore.password=changeit
spring.ssl.bundle.jks.es.truststore.type=PKCS12

spring.elasticsearch.restclient.ssl.bundle=es


spring.security.oauth2.client.registration.naver.client-name=naver
spring.security.oauth2.client.registration.naver.client-id=[NAVER_CLIENT_ID]
spring.security.oauth2.client.registration.naver.client-secret=[NAVER_CLIENT_SECRET]
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8080/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=openid
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.jwk-set-uri=https://nid.naver.com/oauth2/jwks
spring.security.oauth2.client.provider.naver.issuer-uri=https://nid.naver.com


spring.security.oauth2.client.registration.google.client-name=google
spring.security.oauth2.client.registration.google.client-id=[GOOGLE_CLIENT_ID]
spring.security.oauth2.client.registration.google.client-secret=[GOOGLE_CLIENT_SECRET]
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.scope=openid
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth?access_type=offline&prompt=consent
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

spring.security.oauth2.client.registration.kakao.client-id=[KAKAO_CLIENT_ID]
spring.security.oauth2.client.registration.kakao.scope=openid
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=none

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.jwk-set-uri=https://kauth.kakao.com/.well-known/jwks.json
spring.security.oauth2.client.provider.kakao.issuer-uri=https://kauth.kakao.com

spring.jwt.secret=[JWT_SECRET_KEY]
spring.jwt.access-token-expiration=2592000

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.springframework.http.converter=DEBUG

